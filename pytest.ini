[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# -q  : sade çıktı
# -ra : atlanan/başarısız testlerin özeti sonda listelensin
addopts = -q -ra --strict-markers

markers =
    slow: LLM, model dosyası veya indeks gerektiren testler (CI'da atlanır)

# Uyarıları hata saymıyoruz ama görünür kalsınlar
filterwarnings =
    default
